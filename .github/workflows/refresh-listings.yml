name: Refresh listings

# Rebuilds data/listings.json from the six per-agent docs on the leasing
# Linktree, runs the existing verify + expiry tests, and opens a pull request.
# It never pushes to main: a human reads the diff and the "needs your eyes"
# list in the PR body before anything reaches the public site.
#
# Uses the built-in GITHUB_TOKEN. There is no secret to create or rotate.

on:
  schedule:
    # 11:00 UTC Friday = 07:00 Eastern in summer, 06:00 in winter. GitHub cron
    # has no timezone, so this drifts an hour across DST. It runs well before
    # any weekend showing either way.
    - cron: '0 11 * * 5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild listings.json from the agent docs
        id: refresh
        env:
          REPORT_PATH: ${{ runner.temp }}/refresh-report.md
        run: python3 tools/refresh-listings.py

      - name: Stop if nothing changed
        id: changed
        run: |
          if git diff --quiet -- data/listings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to listings.json."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: '20'

      # Every command below runs from the REPOSITORY ROOT on purpose.
      # The package.json scripts ("build", "css", "test") assume the repo root
      # is the working directory, but `npm --prefix tools run <script>` would
      # run them from inside tools/ and every relative path would resolve one
      # level too deep. Rather than rely on that, the steps are spelled out and
      # only the *binary* is resolved out of tools/node_modules.
      - name: Install build dependencies
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm --prefix tools install
          npx --prefix tools playwright install --with-deps chromium

      - name: Build the site
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 tools/transform.py
          npx --prefix tools tailwindcss \
            -c tools/tailwind.config.js \
            -i tools/input.css \
            -o assets/css/site.css --minify

      # The stylesheet is the artifact that has failed silently here before: a
      # bad content glob still exits zero and emits a valid file with no utility
      # classes in it. Assert on the output, not the exit code.
      - name: Sanity-check the stylesheet
        if: steps.changed.outputs.changed == 'true'
        run: |
          SIZE=$(wc -c < assets/css/site.css)
          echo "site.css is $SIZE bytes"
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::site.css is only $SIZE bytes - it has lost its utility classes."
            exit 1
          fi

      - name: Verify
        if: steps.changed.outputs.changed == 'true'
        run: |
          node tools/verify.mjs
          node tools/test-expiry.mjs

      - name: Open a pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/refresh-report.md
        run: |
          set -euo pipefail
          BRANCH="listings/$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Refresh listings from agent docs ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH" --force

          TITLE="Listings refresh — ${{ steps.refresh.outputs.upcoming }} upcoming open houses"
          if [ "${{ steps.refresh.outputs.flags }}" != "0" ]; then
            TITLE="$TITLE (${{ steps.refresh.outputs.flags }} to check)"
          fi

          if ! gh pr create --title "$TITLE" --body-file "$REPORT" --base main --head "$BRANCH"; then
            # Branch already had an open PR (reran the same day) — update it.
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$REPORT"
          fi

      - name: Staleness alarm
        if: always() && steps.refresh.outputs.upcoming == '0'
        run: |
          echo "::error::No upcoming open houses in any agent doc. The properties" \
               "page will show only Zillow links. Check whether the agents have" \
               "stopped updating their documents."
          exit 1
